name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,yaml]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest
      - run: python -m compileall -q src tests
      - run: python -m build
      - name: Verify checked-in schema
        run: |
          cp schema/workflow-0.1.json /tmp/workflow-schema.json
          real schema --output schema/workflow-0.1.json >/dev/null
          diff -u /tmp/workflow-schema.json schema/workflow-0.1.json
